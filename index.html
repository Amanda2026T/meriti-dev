<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00C2AD" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Meriti" />
  <link rel="manifest" href="manifest.json" />
  <title>Meriti</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f7f8fa; color: #111827; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s, color 0.3s; }
    body.dark { background: #061a0e; color: #f0fdf4; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #f1f1f1; } ::-webkit-scrollbar-thumb { background: #00C2AD; border-radius: 3px; }
    @media (max-width: 768px) {
      .desktop-sidebar { display: none !important; }
      .main-content { margin-left: 0 !important; }
      .mobile-nav { display: flex !important; }
      .page-content { padding: 16px !important; padding-bottom: 80px !important; }
      .topbar { padding: 0 16px !important; }
      .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .leaderboard-row { flex-wrap: wrap; }
      table { font-size: 12px; }
      th, td { padding: 8px !important; }
      .modal-inner { padding: 20px !important; max-width: 95vw !important; }
      .roulette-svg { width: 300px !important; height: 300px !important; }
    }
    @media (min-width: 769px) {
      .mobile-nav { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const SUPABASE_URL = "https://zuuintnjucfptemiqnoa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1dWludG5qdWNmcHRlbWlxbm9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Nzc1NjIsImV4cCI6MjEwMTM1MzU2Mn0.p5pxg9b6Ll4DXPEUDxfa-w2Etz-s-otI6R7BYKYupVo";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const DEFAULT_CATALOG = [
      { label: "Curso publicado en fecha", pts: 10, icon: "🎓" },
      { label: "Colaboración con otro departamento", pts: 4, icon: "🤝" },
      { label: "Propuesta de mejora", pts: 5, icon: "💡" },
      { label: "Control de Calidad", pts: 1, icon: "✅" },
      { label: "Entrega antes de tiempo", pts: 3, icon: "⚡" },
      { label: "Resolución de incidencia", pts: 1, icon: "🔧" },
    ];
    // BRAND_COLORS set dynamically after company loads
    const LEVELS = [
      { min: 0,   max: 49,  label: "Rookie",  icon: "🌱", color: "#6B7280" },
      { min: 50,  max: 149, label: "Pro",      icon: "⚡", color: "#00C2AD" },
      { min: 150, max: 299, label: "Experto",  icon: "💎", color: "#0096AD" },
      { min: 300, max: Infinity, label: "Leyenda", icon: "🏆", color: "#FFCF2B" },
    ];
    function getLevel(totalPts) { return LEVELS.find(l => totalPts >= l.min && totalPts <= l.max) || LEVELS[0]; }
    const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${now.getMonth()}`;
    const lastDayOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const isLastDay = now.getDate() === lastDayOfMonth;
    // ── STYLES ──────────────────────────────────────────────────────────────
    const LIGHT = {
      teal: "#00C2AD", green: "#00DD99", yellow: "#FFCF2B",
      mint: "#6BF279", blue: "#0096AD", cream: "#F2F2E7",
      dark: "#091E05", text: "#111827", muted: "#6B7280",
      bg: "#f7f8fa", card: "#ffffff", border: "#E5E7EB",
    };
    const DARK = {
      teal: "#00DD99", green: "#00C2AD", yellow: "#FFCF2B",
      mint: "#6BF279", blue: "#0096AD", cream: "#F2F2E7",
      dark: "#e8f5e9", text: "#f0fdf4", muted: "#9CA3AF",
      bg: "#061a0e", card: "#0a2015", border: "#1a3a25",
    };
    // ── NAV ITEM ─────────────────────────────────────────────────────────────
    function NavItem({ icon, label, active, onClick, badge, teal, muted }) {
      return (
        <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: "10px", padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", width: "100%", textAlign: "left", background: active ? `${teal || "#00C2AD"}15` : "transparent", color: active ? (teal || "#00C2AD") : (muted || "#6B7280"), fontWeight: active ? "700" : "500", fontSize: "14px", fontFamily: "'Plus Jakarta Sans', sans-serif", transition: "all 0.15s", position: "relative" }}>
          <span style={{ fontSize: "16px" }}>{icon}</span>
          <span>{label}</span>
          {badge > 0 && <span style={{ marginLeft: "auto", background: "#EF4444", color: "#fff", borderRadius: "10px", fontSize: "11px", fontWeight: "700", padding: "1px 7px" }}>{badge}</span>}
        </button>
      );
    }
    // ── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
      const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);

      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth <= 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [company, setCompany] = useState(null);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState("dashboard");
      const [authMode, setAuthMode] = useState("login");
      const [authForm, setAuthForm] = useState({ email: "", password: "", name: "" });
      const [authError, setAuthError] = useState("");
      const [authLoading, setAuthLoading] = useState(false);
      // Data
      const [records, setRecords] = useState([]);
      const [profiles, setProfiles] = useState([]);
      const [history, setHistory] = useState([]);
      const [catalog, setCatalog] = useState([]);
      const [prizes, setPrizes] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [notifications, setNotifications] = useState([]);
      // UI state
      const [viewingMonthIndex, setViewingMonthIndex] = useState(0);
      const [selectedDept, setSelectedDept] = useState("all");
      const [form, setForm] = useState({ catalogId: "", date: new Date().toISOString().split("T")[0], desc: "", deptId: "" });
      const [formMsg, setFormMsg] = useState("");
      const [editRecord, setEditRecord] = useState(null);
      const [closingMonth, setClosingMonth] = useState(false);
      const [showNotifs, setShowNotifs] = useState(false);
      // Roulette
      const [showRoulette, setShowRoulette] = useState(false);
      const [spinning, setSpinning] = useState(false);
      const [spinDeg, setSpinDeg] = useState(0);
      const [wonPrize, setWonPrize] = useState(null);
      const [currentDeg, setCurrentDeg] = useState(0);
      // Admin forms
      const [newCatalogItem, setNewCatalogItem] = useState({ label: "", pts: "", icon: "⭐" });
      const [newPrize, setNewPrize] = useState("");
      const [newDept, setNewDept] = useState("");
      const [editDept, setEditDept] = useState(null);
      const [companyForm, setCompanyForm] = useState({ name: "", logo: "", color1: "#00C2AD", color2: "#00DD99", color3: "#FFCF2B" });
      const [companyMsg, setCompanyMsg] = useState("");
      const logoInputRef = useRef(null);
      const [editCatalogItem, setEditCatalogItem] = useState(null);
      const [showPickerAdd, setShowPickerAdd] = useState(false);
      const [showAdminMenu, setShowAdminMenu] = useState(false);
      const [showPickerEdit, setShowPickerEdit] = useState(false);
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem("meriti_dark") === "true");
      const [challenge, setChallenge] = useState(null);
      const [challengeForm, setChallengeForm] = useState({ title: "", description: "", targetPts: "", prize: "", deadline: "" });
      const [challengeMsg, setChallengeMsg] = useState("");
      const [showChallengeForm, setShowChallengeForm] = useState(false);
      const [likes, setLikes] = useState({});
      const [myLikes, setMyLikes] = useState([]);
      const [onboardingStep, setOnboardingStep] = useState(0);
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [inviteEmail, setInviteEmail] = useState("");
      const [inviteMsg, setInviteMsg] = useState("");
      const [invitations, setInvitations] = useState([]);
      const [validationComment, setValidationComment] = useState({});
      useEffect(() => {
        document.body.classList.toggle("dark", darkMode);
        localStorage.setItem("meriti_dark", darkMode);
      }, [darkMode]);
      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) loadProfile(session.user.id);
          else setLoading(false);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => {
          setSession(s);
          if (s) loadProfile(s.user.id);
          else { setProfile(null); setLoading(false); }
        });
        return () => subscription.unsubscribe();
      }, []);
      useEffect(() => {
        if (profile) {
          loadRecords(); loadProfiles(); loadHistory(); loadCatalog();
          loadPrizes(); loadNotifications(); loadDepartments(); loadCompany(); loadInvitations(); checkOnboarding(); loadChallenge(); loadLikes();
        }
      }, [profile]);
      // ── DATA LOADERS ──────────────────────────────────────────────────────
      async function loadProfile(uid) {
        const { data } = await supabase.from("profiles").select("*").eq("id", uid).single();
        setProfile(data); setLoading(false);
      }
      async function loadRecords() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("records").select("*").eq("company_id", profile.company_id).order("created_at", { ascending: false });
        setRecords(data || []);
      }
      async function loadProfiles() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("profiles").select("*").eq("company_id", profile.company_id).order("name");
        setProfiles(data || []);
      }
      async function loadHistory() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("month_history").select("*").eq("company_id", profile.company_id).order("closed_at", { ascending: false });
        setHistory(data || []);
      }
      async function loadCatalog() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("catalog_items").select("*").eq("company_id", profile.company_id).order("created_at");
        setCatalog(data || []);
      }
      async function loadPrizes() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("prizes").select("*").eq("company_id", profile.company_id).order("created_at");
        setPrizes(data || []);
      }
      async function loadDepartments() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("departments").select("*").eq("company_id", profile.company_id).order("name");
        setDepartments(data || []);
      }
      async function loadCompany() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("company_settings").select("*").eq("id", profile.company_id).single();
        if (data) {
          setCompany(data);
          setCompanyForm({
            name: data.name || "",
            logo: data.logo || "",
            color1: data.color1 || "#00C2AD",
            color2: data.color2 || "#00DD99",
            color3: data.color3 || "#FFCF2B",
          });
        }
      }
      async function loadNotifications() {
        if (!session) return;
        const { data } = await supabase.from("notifications").select("*").eq("user_id", session.user.id).order("created_at", { ascending: false }).limit(20);
        setNotifications(data || []);
      }
      async function loadInvitations() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("invitations").select("*").eq("company_id", profile.company_id).order("created_at", { ascending: false });
        setInvitations(data || []);
      }
      async function checkOnboarding() {
        if (!profile?.company_id || profile?.role !== "admin") return;
        const { data } = await supabase.from("company_settings")
          .select("onboarding_done")
          .eq("id", profile.company_id)
          .single();
        if (data && !data.onboarding_done) setShowOnboarding(true);
      }
      async function completeOnboarding() {
        if (!profile?.company_id) return;
        await supabase.from("company_settings")
          .update({ onboarding_done: true })
          .eq("id", profile.company_id);
        setShowOnboarding(false);
      }
      async function loadChallenge() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("challenges").select("*").eq("active", true).eq("company_id", profile.company_id).limit(1).single();
        if (data) setChallenge(data);
        else setChallenge(null);
      }
      async function loadLikes() {
        if (!profile?.company_id) return;
        const { data: allLikes } = await supabase.from("likes").select("*").eq("company_id", profile.company_id);
        const likeCounts = {};
        (allLikes || []).forEach(l => { likeCounts[l.to_user_id] = (likeCounts[l.to_user_id] || 0) + 1; });
        setLikes(likeCounts);
        const today = new Date().toISOString().split("T")[0];
        const myL = (allLikes || []).filter(l => l.from_user_id === session.user.id && l.date === today).map(l => l.to_user_id);
        setMyLikes(myL);
      }
      async function handleLike(toUserId) {
        if (myLikes.includes(toUserId) || toUserId === session.user.id) return;
        const today = new Date().toISOString().split("T")[0];
        await supabase.from("likes").insert({ from_user_id: session.user.id, to_user_id: toUserId, date: today, company_id: companyId });
        await supabase.from("notifications").insert({ user_id: toUserId, message: `👏 ${profile.name} te ha dado un aplauso`, read: false, company_id: companyId });
        await loadLikes();
      }
      async function handleSaveChallenge() {
        if (!challengeForm.title.trim() || !challengeForm.targetPts || !challengeForm.deadline) { setChallengeMsg("⚠️ Completa título, objetivo y fecha límite."); return; }
        await supabase.from("challenges").update({ active: false }).eq("active", true).eq("company_id", companyId);
        await supabase.from("challenges").insert({ title: challengeForm.title, description: challengeForm.description, target_pts: parseInt(challengeForm.targetPts), prize: challengeForm.prize, deadline: challengeForm.deadline, active: true, month: monthKey, company_id: companyId });
        setChallengeForm({ title: "", description: "", targetPts: "", prize: "", deadline: "" });
        setShowChallengeForm(false);
        await loadChallenge();
      }
      async function handleCloseChallenge() {
        if (!challenge) return;
        await supabase.from("challenges").update({ active: false }).eq("id", challenge.id);
        setChallenge(null);
      }
      function exportToExcel() {
        const data = records.map(r => {
          const cat = catalog.find(c => c.id === r.catalog_id);
          const dept = departments.find(d => d.id === r.dept_id);
          return {
            "Nombre": r.user_name,
            "Departamento": dept?.name || "—",
            "Logro": cat?.label || "—",
            "Descripción": r.description,
            "Puntos": r.pts,
            "Fecha": r.date,
            "Mes": r.month,
            "Validado": r.validated ? "Sí" : "No",
            "Comentario manager": r.manager_comment || "—",
          };
        });
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Logros");
        // History sheet
        const histData = history.map(h => ({
          "Mes": h.label,
          "Ganador": h.winner,
          ...Object.fromEntries((h.scores || []).map(s => [s.name, s.pts]))
        }));
        if (histData.length > 0) {
          const ws2 = XLSX.utils.json_to_sheet(histData);
          XLSX.utils.book_append_sheet(wb, ws2, "Histórico");
        }
        XLSX.writeFile(wb, `Meriti_${MONTH_NAMES[now.getMonth()]}_${now.getFullYear()}.xlsx`);
      }
      async function handleSendInvite() {
        if (!inviteEmail.trim()) return;
        const existing = invitations.find(i => i.email === inviteEmail.trim());
        if (existing) { setInviteMsg("⚠️ Ya existe una invitación para ese email."); setTimeout(() => setInviteMsg(""), 3000); return; }
        await supabase.from("invitations").insert({ email: inviteEmail.trim(), status: "pending", company_id: companyId });
        setInviteEmail(""); await loadInvitations();
        setInviteMsg("✅ Invitación registrada. Comparte el enlace de registro con tu equipo.");
        setTimeout(() => setInviteMsg(""), 4000);
      }
      async function handleDeleteInvitation(id) {
        await supabase.from("invitations").delete().eq("id", id);
        await loadInvitations();
      }
      async function handleEditCatalogItem() {
        if (!editCatalogItem?.label.trim() || !editCatalogItem?.pts) return;
        const { error } = await supabase.from("catalog_items").update({ label: editCatalogItem.label.trim(), pts: parseInt(editCatalogItem.pts), icon: editCatalogItem.icon }).eq("id", editCatalogItem.id);
        if (error) { alert("Error al guardar: " + error.message); return; }
        setEditCatalogItem(null);
        setShowPickerEdit(false);
        await loadCatalog();
      }
      async function handleValidateWithComment(id) {
        const comment = validationComment[id] || "";
        await supabase.from("records").update({ validated: true, manager_comment: comment }).eq("id", id);
        const rec = records.find(r => r.id === id);
        if (rec) {
          const msg = comment ? `✅ Tu logro "${rec.description}" fue validado — +${rec.pts} pts. Comentario: ${comment}` : `✅ Tu logro "${rec.description}" ha sido validado — +${rec.pts} pts`;
          await supabase.from("notifications").insert({ user_id: rec.user_id, message: msg, read: false, company_id: companyId });
        }
        setValidationComment(vc => { const n = {...vc}; delete n[id]; return n; });
        await loadRecords();
      }
      async function markAllRead() {
        await supabase.from("notifications").update({ read: true }).eq("user_id", session.user.id).eq("read", false);
        await loadNotifications();
      }
      // ── AUTH ──────────────────────────────────────────────────────────────
      async function handleLogin() {
        setAuthLoading(true); setAuthError("");
        const { error } = await supabase.auth.signInWithPassword({ email: authForm.email, password: authForm.password });
        if (error) setAuthError("Email o contraseña incorrectos.");
        setAuthLoading(false);
      }
      async function handleRegister() {
        if (!authForm.name.trim()) { setAuthError("Introduce tu nombre."); return; }
        if (authForm.password.length < 6) { setAuthError("Mínimo 6 caracteres."); return; }
        setAuthLoading(true); setAuthError("");
        // Check for invite token in URL
        const urlParams = new URLSearchParams(window.location.search);
        const inviteToken = urlParams.get("invite");
        const metadata = { name: authForm.name };
        if (inviteToken) metadata.invite_token = inviteToken;
        const { error } = await supabase.auth.signUp({ email: authForm.email, password: authForm.password, options: { data: metadata } });
        if (error) setAuthError(error.message);
        else setAuthError("✅ ¡Cuenta creada! Inicia sesión.");
        setAuthLoading(false);
      }
      async function handleLogout() { await supabase.auth.signOut(); setView("dashboard"); }
      // ── COMPANY ───────────────────────────────────────────────────────────
      async function handleSaveCompany() {
        if (!profile?.company_id) return;
        const payload = { name: companyForm.name, logo: companyForm.logo, color1: companyForm.color1, color2: companyForm.color2, color3: companyForm.color3 };
        await supabase.from("company_settings").update(payload).eq("id", profile.company_id);
        await loadCompany();
        setCompanyMsg("✅ Cambios guardados.");
        setTimeout(() => setCompanyMsg(""), 3000);
      }
      function handleLogoUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setCompanyForm(f => ({ ...f, logo: ev.target.result }));
        reader.readAsDataURL(file);
      }
      // ── DEPARTMENTS ───────────────────────────────────────────────────────
      async function handleAddDept() {
        if (!newDept.trim()) return;
        await supabase.from("departments").insert({ name: newDept.trim(), company_id: companyId });
        setNewDept(""); await loadDepartments();
      }
      async function handleSaveEditDept() {
        if (!editDept?.name.trim()) return;
        await supabase.from("departments").update({ name: editDept.name }).eq("id", editDept.id);
        setEditDept(null); await loadDepartments();
      }
      async function handleDeleteDept(id) {
        await supabase.from("departments").delete().eq("id", id);
        await loadDepartments();
      }
      // ── CATALOG ───────────────────────────────────────────────────────────
      async function handleAddCatalogItem() {
        if (!newCatalogItem.label.trim() || !newCatalogItem.pts) return;
        await supabase.from("catalog_items").insert({ label: newCatalogItem.label.trim(), pts: parseInt(newCatalogItem.pts), icon: newCatalogItem.icon || "⭐", company_id: companyId });
        setNewCatalogItem({ label: "", pts: "", icon: "⭐" }); await loadCatalog();
      }
      async function handleDeleteCatalogItem(id) {
        await supabase.from("catalog_items").delete().eq("id", id); await loadCatalog();
      }
      // ── PRIZES ────────────────────────────────────────────────────────────
      async function handleAddPrize() {
        if (!newPrize.trim()) return;
        await supabase.from("prizes").insert({ label: newPrize.trim(), company_id: companyId });
        setNewPrize(""); await loadPrizes();
      }
      async function handleDeletePrize(id) {
        await supabase.from("prizes").delete().eq("id", id); await loadPrizes();
      }
      // ── RECORDS ───────────────────────────────────────────────────────────
      async function handleSubmit() {
        if (!form.catalogId || !form.date || !form.desc.trim()) { setFormMsg("⚠️ Completa todos los campos."); return; }
        const cat = catalog.find(c => c.id === form.catalogId);
        if (!cat) { setFormMsg("⚠️ Selecciona un item válido."); return; }

                                    </g>

                        </div>
                      )}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: "10px" }}>
                    <div style={{ flex: 1 }}><label style={S.label}>Nombre</label><input style={S.input} value={editCatalogItem.label} onChange={e => setEditCatalogItem(i => ({ ...i, label: e.target.value }))} /></div>
                    <div style={{ width: "90px" }}><label style={S.label}>Puntos</label><input style={S.input} type="number" min="1" value={editCatalogItem.pts} onChange={e => setEditCatalogItem(i => ({ ...i, pts: e.target.value }))} /></div>
                  </div>
                  <div style={{ display: "flex", gap: "10px", justifyContent: "flex-end" }}>
                    <button style={S.btnSecondary} onClick={() => setEditCatalogItem(null)}>Cancelar</button>
                    <button style={S.btnPrimary} onClick={handleEditCatalogItem}>Guardar</button>
                  </div>
                </div>
              </div>
            </div>
          )}
          {/* ── MODAL EDITAR ── */}
          {editRecord && (
            <div style={S.overlay}>
              <div style={S.modal}>
                <div style={{ fontWeight: "800", fontSize: "18px", marginBottom: "20px" }}>✏️ Editar logro</div>
                <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                  <div><label style={S.label}>Logro</label>
                    <select style={S.select} value={editRecord.catalog_id} onChange={e => setEditRecord(r => ({ ...r, catalog_id: e.target.value }))}>
                      {catalog.map(c => <option key={c.id} value={c.id}>{c.icon} {c.label} — {c.pts} pts</option>)}
                    </select>
                  </div>
                  <div><label style={S.label}>Descripción</label><input style={S.input} value={editRecord.description} onChange={e => setEditRecord(r => ({ ...r, description: e.target.value }))} /></div>
                  <div><label style={S.label}>Fecha</label><input style={S.input} type="date" value={editRecord.date} onChange={e => setEditRecord(r => ({ ...r, date: e.target.value }))} /></div>
                  <div style={{ display: "flex", gap: "10px", justifyContent: "flex-end", marginTop: "4px" }}>
                    <button style={S.btnSecondary} onClick={() => setEditRecord(null)}>Cancelar</button>
                    <button style={S.btnPrimary} onClick={handleSaveEdit}>Guardar</button>
                  </div>
                </div>
              </div>
            </div>
          )}
          {/* ── MODAL CIERRE MES ── */}
          {closingMonth && (
            <div style={S.overlay}>
              <div style={{ ...S.modal, textAlign: "center" }}>
                <div style={{ fontSize: "56px", marginBottom: "16px" }}>🏆</div>
                <div style={{ fontWeight: "900", fontSize: "22px", marginBottom: "8px" }}>Cierre de {MONTH_NAMES[now.getMonth()]}</div>
                <div style={{ color: C.muted, marginBottom: "8px" }}>El ganador del mes es:</div>
                <div style={{ fontSize: "32px", fontWeight: "900", color: winner ? getColor(winner.name) : C.text, marginBottom: "4px" }}>{winner?.name || "—"}</div>
                <div style={{ color: C.muted, marginBottom: "28px" }}>{winner?.pts || 0} puntos</div>
                <div style={{ display: "flex", gap: "10px", justifyContent: "center" }}>
                  <button style={S.btnSecondary} onClick={() => setClosingMonth(false)}>Cancelar</button>
                  <button style={S.btnYellow} onClick={handleCloseMonth}>Confirmar y cerrar mes</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
