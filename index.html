  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F8FAFC; color: #111827; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s, color 0.3s; }
    body.dark { background: #060E1C; color: #f0fdf4; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes dot1 { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
    @keyframes dot2 { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
    @keyframes dot3 { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    .view-transition { animation: scaleIn 0.18s ease; }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    .skeleton-light { background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    button:active { transform: scale(0.97); transition: transform 0.1s ease; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #f1f1f1; } ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 3px; }
    @media (max-width: 768px) {
      .desktop-sidebar { display: none !important; }
      .main-content { margin-left: 0 !important; }
      .mobile-nav { display: flex !important; }
      .page-content { padding: 16px !important; padding-bottom: 80px !important; }
      .topbar { padding: 0 16px !important; }
      .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .leaderboard-row { flex-wrap: wrap; }
      table { font-size: 12px; }
      th, td { padding: 8px !important; }
      .modal-inner { padding: 20px !important; max-width: 95vw !important; }
      .roulette-svg { width: 300px !important; height: 300px !important; }
    }
    @media (min-width: 769px) {
      .mobile-nav { display: none !important; }
    }
  </style>
</head>

  <script type="text/babel">

      { min: 0,   max: 49,  label: "Rookie",  icon: "🌱", color: "#6B7280" },

    const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

    const lastDayOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const isLastDay = now.getDate() === lastDayOfMonth;
    // ── STYLES ──────────────────────────────────────────────────────────────
    const LIGHT = {
      teal: "#1E3A5F", green: "#B8860B", yellow: "#B8860B",
      mint: "#D4AF37", blue: "#1E3A5F", cream: "#F8FAFC",
      dark: "#1E3A5F", text: "#111827", muted: "#6B7280",

    // ── NAV ITEM ─────────────────────────────────────────────────────────────
    function NavItem({ icon, label, active, onClick, badge, teal, muted }) {
      return (
        <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: "10px", padding: "9px 16px", borderRadius: "8px", border: "none", cursor: "pointer", width: "100%", textAlign: "left", background: active ? `${teal || "#D4AF37"}15` : "transparent", color: active ? (teal || "#D4AF37") : (muted || "#6B7280"), fontWeight: active ? "700" : "500", fontSize: "14px", fontFamily: "'Plus Jakarta Sans', sans-serif", transition: "all 0.15s", position: "relative" }}>

    // ── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
      const detectMobile = () => window.innerWidth <= 768 || (window.innerHeight <= 480 && window.innerWidth <= 950);
      const [isMobile, setIsMobile] = useState(detectMobile());

      useEffect(() => {
        const handleResize = () => setIsMobile(detectMobile());
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);
        return () => { window.removeEventListener('resize', handleResize); window.removeEventListener('orientationchange', handleResize); };
      }, []);

      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [company, setCompany] = useState(null);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState("dashboard");
      const [authMode, setAuthMode] = useState("login");
      const [authForm, setAuthForm] = useState({ email: "", password: "", name: "" });
      const [authError, setAuthError] = useState("");

      const [records, setRecords] = useState([]);
      const [profiles, setProfiles] = useState([]);
      const [history, setHistory] = useState([]);
      const [catalog, setCatalog] = useState([]);
      const [prizes, setPrizes] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [notifications, setNotifications] = useState([]);
      // UI state
      const [viewingMonthIndex, setViewingMonthIndex] = useState(0);
      const [selectedDept, setSelectedDept] = useState("all");
      const [form, setForm] = useState({ catalogId: "", date: new Date().toISOString().split("T")[0], desc: "", deptId: "" });
      const [formMsg, setFormMsg] = useState("");
      const [editRecord, setEditRecord] = useState(null);
      const [closingMonth, setClosingMonth] = useState(false);
      const [showNotifs, setShowNotifs] = useState(false);
      // Roulette
      const [showRoulette, setShowRoulette] = useState(false);
      const [spinning, setSpinning] = useState(false);
      const [spinDeg, setSpinDeg] = useState(0);
      const [wonPrize, setWonPrize] = useState(null);
      const [currentDeg, setCurrentDeg] = useState(0);
      // Admin forms
      const [newCatalogItem, setNewCatalogItem] = useState({ label: "", pts: "" });
      const [newPrize, setNewPrize] = useState("");
      const [newDept, setNewDept] = useState("");
      const [editDept, setEditDept] = useState(null);
      const [companyForm, setCompanyForm] = useState({ name: "", logo: "", color1: "#D4AF37", color2: "#B8860B", color3: "#1E3A5F" });
      const [companyMsg, setCompanyMsg] = useState("");
      const logoInputRef = useRef(null);
      const [editCatalogItem, setEditCatalogItem] = useState(null);
            const [showAdminMenu, setShowAdminMenu] = useState(false);
      const [toasts, setToasts] = useState([]);
      const showToast = (message, type = "success") => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };
      const [congratsTarget, setCongratsTarget] = useState(null);
      const [congratsMsg, setCongratsMsg] = useState("");
      const [congratsEmoji, setCongratsEmoji] = useState("🎉");
      const [visibility, setVisibility] = useState("all");
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem("meriti_dark") === "true");
      const [challenge, setChallenge] = useState(null);
      const [challengeForm, setChallengeForm] = useState({ title: "", description: "", targetPts: "", prize: "", deadline: "", unit: "pts" });
      const [progressInput, setProgressInput] = useState("");
      const [teamTab, setTeamTab] = useState("miembros");
      const [histFilter, setHistFilter] = useState("all");
      const [challengeMsg, setChallengeMsg] = useState("");
      const [showChallengeForm, setShowChallengeForm] = useState(false);
      const [likes, setLikes] = useState({});
      const [myLikes, setMyLikes] = useState([]);
      const [onboardingStep, setOnboardingStep] = useState(0);
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [inviteEmail, setInviteEmail] = useState("");
      const [inviteMsg, setInviteMsg] = useState("");
      const [invitations, setInvitations] = useState([]);
      const [validationComment, setValidationComment] = useState({});
      useEffect(() => {
        document.body.classList.toggle("dark", darkMode);
        localStorage.setItem("meriti_dark", darkMode);
      }, [darkMode]);
      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) loadProfile(session.user.id);
          else setLoading(false);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => {
          setSession(s);
          if (s) loadProfile(s.user.id);
          else { setProfile(null); setLoading(false); }
        });
        return () => subscription.unsubscribe();
      }, []);
      useEffect(() => {
        if (profile) {
          loadRecords(); loadProfiles(); loadHistory(); loadCatalog();
          loadPrizes(); loadNotifications(); loadDepartments(); loadCompany(); loadInvitations(); checkOnboarding(); loadChallenge(); loadLikes();
        }
      }, [profile]);
      // ── DATA LOADERS ──────────────────────────────────────────────────────
      async function loadProfile(uid) {
        const { data } = await supabase.from("profiles").select("*").eq("id", uid).single();
        setProfile(data); setLoading(false);
      }
      async function loadRecords() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("records").select("*").eq("company_id", profile.company_id).order("created_at", { ascending: false });
        setRecords(data || []);
      }
      async function loadProfiles() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("profiles").select("*").eq("company_id", profile.company_id).order("name");
        setProfiles(data || []);
      }
      async function loadHistory() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("month_history").select("*").eq("company_id", profile.company_id).order("closed_at", { ascending: false });
        setHistory(data || []);
      }
      async function loadCatalog() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("catalog_items").select("*").eq("company_id", profile.company_id).order("created_at");
        setCatalog(data || []);
      }
      async function loadPrizes() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("prizes").select("*").eq("company_id", profile.company_id).order("created_at");
        setPrizes(data || []);
      }
      async function loadDepartments() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("departments").select("*").eq("company_id", profile.company_id).order("name");
        setDepartments(data || []);
      }
      async function loadCompany() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("company_settings").select("*").eq("id", profile.company_id).single();
        if (data) {
          setCompany(data);
          setVisibility(data.visibility || "all");
          setCompanyForm({
            name: data.name || "",
            logo: data.logo || "",
            color1: data.color1 || "#D4AF37",
            color2: data.color2 || "#B8860B",
            color3: data.color3 || "#1E3A5F",
          });
        }
      }
      async function loadNotifications() {
        if (!session) return;
        const { data } = await supabase.from("notifications").select("*").eq("user_id", session.user.id).order("created_at", { ascending: false }).limit(20);
        setNotifications(data || []);
      }
      async function loadInvitations() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("invitations").select("*").eq("company_id", profile.company_id).order("created_at", { ascending: false });
        setInvitations(data || []);
      }
      async function checkOnboarding() {
        if (!profile?.company_id || profile?.role !== "admin") return;
        const { data } = await supabase.from("company_settings")
          .select("onboarding_done")
          .eq("id", profile.company_id)
          .single();
        if (data && !data.onboarding_done) setShowOnboarding(true);
      }
      async function completeOnboarding() {
        if (!profile?.company_id) return;
        await supabase.from("company_settings")
          .update({ onboarding_done: true })
          .eq("id", profile.company_id);
        setShowOnboarding(false);
      }
      async function loadChallenge() {
        if (!profile?.company_id) return;
        const { data } = await supabase.from("challenges").select("*").eq("active", true).eq("company_id", profile.company_id).limit(1).single();
        if (data) setChallenge(data);
        else setChallenge(null);
      }
      async function loadLikes() {
        if (!profile?.company_id) return;
        const { data: allLikes } = await supabase.from("likes").select("*").eq("company_id", profile.company_id);
        const likeCounts = {};
        (allLikes || []).forEach(l => { likeCounts[l.to_user_id] = (likeCounts[l.to_user_id] || 0) + 1; });
        setLikes(likeCounts);
        const today = new Date().toISOString().split("T")[0];
        const myL = (allLikes || []).filter(l => l.from_user_id === session.user.id && l.date === today).map(l => l.to_user_id);
        setMyLikes(myL);
      }
      async function handleLike(toUserId) {
        if (myLikes.includes(toUserId) || toUserId === session.user.id) return;
        const today = new Date().toISOString().split("T")[0];
        await supabase.from("likes").insert({ from_user_id: session.user.id, to_user_id: toUserId, date: today, company_id: companyId });
        await supabase.from("notifications").insert({ user_id: toUserId, message: `👏 ${profile.name} te ha dado un aplauso`, read: false, company_id: companyId });
        await loadLikes();
        showToast("¡Aplauso enviado!");
      }
      async function handleSaveChallenge() {
        if (!challengeForm.title.trim() || !challengeForm.targetPts || !challengeForm.deadline) { setChallengeMsg("⚠️ Completa título, objetivo y fecha límite."); return; }
        const unit = challengeForm.unit || "pts";
        const payload = { title: challengeForm.title.trim(), description: challengeForm.description, target_pts: Math.round(Number(challengeForm.targetPts)), prize: challengeForm.prize, deadline: challengeForm.deadline, active: true, month: monthKey, company_id: companyId };
        if (unit !== "pts") { payload.unit_type = unit; payload.current_progress = 0; }
        const { data: created, error } = await supabase.from("challenges").insert(payload).select().single();
        if (error) {
          const needsSql = /unit_type|current_progress/.test(error.message || "");
          setChallengeMsg(needsSql ? "❌ Falta actualizar la base de datos para usar euros o unidades (SQL de retos)." : "❌ No se pudo lanzar el reto: " + error.message);
          return;
        }
        if (created?.id) await supabase.from("challenges").update({ active: false }).eq("active", true).eq("company_id", companyId).neq("id", created.id);
        setChallengeForm({ title: "", description: "", targetPts: "", prize: "", deadline: "", unit: "pts" });
        setChallengeMsg("");
        setShowChallengeForm(false);
        await loadChallenge();
        showToast("Reto lanzado");
      }
      async function handleCloseChallenge() {
        if (!challenge) return;
        await supabase.from("challenges").update({ active: false }).eq("id", challenge.id);
        setChallenge(null);
        showToast("Reto cerrado");
      }
      async function handleUpdateProgress() {
        if (!challenge) return;
        const v = Number(progressInput);
        if (progressInput === "" || isNaN(v) || v < 0) { showToast("Introduce una cantidad válida", "error"); return; }
        const { error } = await supabase.from("challenges").update({ current_progress: v }).eq("id", challenge.id);
        if (error) { showToast("No se pudo actualizar el progreso", "error"); return; }
        setChallenge(ch => ({ ...ch, current_progress: v }));
        setProgressInput("");
        showToast("Progreso actualizado");
      }
      function exportToExcel() {
        const data = records.map(r => {
          const cat = catalog.find(c => c.id === r.catalog_id);
          const dept = departments.find(d => d.id === r.dept_id);
          return {
            "Nombre": r.user_name,
            "Departamento": dept?.name || "—",
            "Logro": cat?.label || "—",
            "Descripción": r.description,
            "Puntos": r.pts,
            "Fecha": r.date,
            "Mes": r.month,
            "Validado": r.validated ? "Sí" : "No",
            "Comentario manager": r.manager_comment || "—",
          };
        });
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Logros");

        const histData = history.map(h => ({
          "Mes": h.label,
          "Ganador": h.winner,
          ...Object.fromEntries((h.scores || []).map(s => [s.name, s.pts]))
        }));
        if (histData.length > 0) {
          const ws2 = XLSX.utils.json_to_sheet(histData);
          XLSX.utils.book_append_sheet(wb, ws2, "Histórico");
        }
        XLSX.writeFile(wb, `Meriti_${MONTH_NAMES[now.getMonth()]}_${now.getFullYear()}.xlsx`);

      async function handleSendCongrats() {
        if (!congratsTarget || !congratsMsg.trim()) return;
        const msg = congratsEmoji + " " + (profile.role === "admin" ? "El manager" : profile.name) + ' te ha enviado un mensaje: "' + congratsMsg + '"';

        if (!inviteEmail.trim()) return;

        setInviteEmail(""); await loadInvitations();
        setInviteMsg("✅ Invitación registrada. Comparte el enlace de registro con tu equipo.");
        setTimeout(() => setInviteMsg(""), 4000);

        await supabase.from("invitations").delete().eq("id", id);
        await loadInvitations();

        if (!editCatalogItem?.label.trim() || !editCatalogItem?.pts) return;

        setEditCatalogItem(null);
        showToast("Catálogo actualizado");
        await loadCatalog();

      async function handleValidateWithComment(id) {

                              const toRad = d => d * Math.PI / 180;

                                const sa = i * sliceDeg - 90, ea = sa + sliceDeg;
                                const x1 = cx + r * Math.cos(toRad(sa)), y1 = cy + r * Math.sin(toRad(sa));

                                // Text along the radius, nicely centered

                                const tx = cx + textR * Math.cos(toRad(mid));
                                const ty = cy + textR * Math.sin(toRad(mid));

                                const maxW = n <= 4 ? 3 : n <= 6 ? 2 : 2;

                                      {lines.slice(0, 3).map((line, li) => (
                                        <text key={li} x={0} y={(li - (Math.min(lines.length, 3) - 1) / 2) * lh} textAnchor="middle" dominantBaseline="central" fill="#fff" fontWeight="700" fontSize={fs} fontFamily="Plus Jakarta Sans, sans-serif" style={{ pointerEvents: "none", textShadow: "0 1px 2px rgba(0,0,0,0.4)" }}>{line}</text>
                                      ))}
                                    </g>
                                  </g>
                                );
                              });

              <div style={isMobile
                ? { position: "fixed", left: 0, right: 0, bottom: 0, maxHeight: "72vh", overflowY: "auto", background: C.card, borderTop: `1px solid ${T.line}`, borderRadius: "28px 28px 0 0", padding: "10px 16px calc(22px + env(safe-area-inset-bottom, 0px))", zIndex: 300, boxShadow: "0 -10px 40px rgba(0,0,0,0.45)", animation: "sheetUp 0.25s ease" }
                : { position: "fixed", top: "66px", right: "32px", width: "340px", maxHeight: "420px", overflowY: "auto", background: C.card, border: `1px solid ${T.line}`, borderRadius: "24px", padding: "14px", zIndex: 300, boxShadow: "0 12px 40px rgba(0,0,0,0.35)", animation: "fadeIn 0.2s ease" }}>
                {isMobile && <div style={{ width: "36px", height: "4px", borderRadius: "2px", background: T.soft, margin: "0 auto 14px" }} />}
                <div style={{ fontFamily: "'DM Serif Display', serif", fontSize: "19px", color: C.text, marginBottom: "12px" }}>Notificaciones</div>
                {notifications.length === 0 ? <div style={{ color: T.dim, fontSize: "13px", textAlign: "center", padding: "20px 0" }}>Sin notificaciones</div>
                  : notifications.map(n => <div key={n.id} style={{ padding: "11px 14px", borderRadius: "20px", marginBottom: "7px", background: n.read ? T.faint : `${C.teal}10`, border: `1px solid ${n.read ? T.line : `${C.teal}30`}`, fontSize: "12.5px", lineHeight: 1.45, color: n.read ? T.dim : C.text }}>{n.message}</div>)}
              </div>
            </>
          )}

          {/* ── TOASTS ── */}
          {toasts.map(t => (
            <div key={t.id} style={{
              position: "fixed",
              bottom: isMobile ? "calc(76px + env(safe-area-inset-bottom, 0px))" : "24px",
              left: "50%", transform: "translateX(-50%)",
              background: t.type === "success" ? "#D4AF37" : t.type === "error" ? "#EF4444" : "#1E3A5F",
              color: t.type === "success" ? "#060E1C" : "#fff",
              padding: "11px 22px", borderRadius: "50px",
              fontSize: "13px", fontWeight: "700",
              fontFamily: "'Plus Jakarta Sans', sans-serif",
              zIndex: 10000, whiteSpace: "nowrap",
              boxShadow: "0 4px 24px rgba(0,0,0,0.3)",
              animation: "slideUp 0.3s ease",
            }}>
              {t.type === "success" ? "✓  " : t.type === "error" ? "✕  " : "ℹ  "}{t.message}
            </div>
          ))}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
